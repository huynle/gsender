name: CI

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - master
      - dev
      - features/* # all feature branches
      - bugfix/*
    # Sequence of patterns matched against refs/tags
    tags:
      - '*'
      - '!master-latest' # rolling tag moved by the publish job below
  pull_request:
    branches: [ "master" ]

env:
  GITHUB_TOKEN: ${{ secrets.CI_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=8192
  COMMIT_COUNT: ${{ github.run_number }}
  VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup and build
        uses: ./.github/actions/setup-build
      - name: Build Linux binaries
        run: yarn run build:linux
      - name: Prepare release assets
        shell: bash
        run: |
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/linux
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x86_64.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-Intel-64Bit.AppImage"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-amd64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-Intel-64Bit.deb"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-arm64.AppImage" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-ARM-64Bit.AppImage"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-arm64.deb" "releases/linux/${PACKAGE_NAME}-${PACKAGE_VERSION}-Linux-ARM-64Bit.deb"
          ls -al output releases/linux
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/linux/*
          prerelease: true
          draft: true
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux_artifact
          path: releases/linux/*
          compression-level: 0 # no compression
          retention-days: 7

  build-macos:
    name: Build macOS packages
    environment: CI
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      # Skip code signing for pull requests
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pip setuptools
        run: sudo -H pip install setuptools
      - name: Setup and build
        uses: ./.github/actions/setup-build
      - name: Build macOS binaries
        run: yarn run build:macos
      - name: Prepare release assets
        shell: bash
        run: |
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/macos
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x64.dmg" "releases/macos/gSender-${PACKAGE_VERSION}-Mac-Intel.dmg"
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-arm64.dmg" "releases/macos/gSender-${PACKAGE_VERSION}-Mac-Silicon.dmg"
          ls -al output releases/macos
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/macos/*
          prerelease: true
          draft: true
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos_artifact
          path: releases/macos/*
          compression-level: 0 # no compression
          retention-days: 7

  build-windows:
    name: Build Windows packages
    environment: CI
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Prepare VC++ Runtime
        run: choco install -y vcredist2017
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Write client auth certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $b64 = "${{ secrets.SM_CLIENT_CERT_FILE_BASE64 }}" -replace '\s', ''
          $certBytes = [Convert]::FromBase64String($b64)
          $certPath = "${{ github.workspace }}\sm_client_cert.p12"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "SM_CLIENT_CERT_FILE=$certPath" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Set up DigiCert SM Tools
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: ${{ secrets.SM_HOST }}
        run: |
          curl -X GET "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download" `
            -H "x-api-key:$env:SM_API_KEY" -o smtools.msi
          $msiPath = (Resolve-Path smtools.msi).Path
          $proc = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /quiet /qn" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          $smctl = Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter "smctl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $smctl) { throw "smctl.exe not found after install" }
          $klPath = $smctl.DirectoryName
          Write-Host "smctl found at: $klPath"
          echo $klPath | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          Set-Content -Path "C:\Windows\System32\pkcs11properties.cfg" -Value "curl_path=$klPath"
          [System.Environment]::SetEnvironmentVariable("SM_API_KEY",              $env:SM_API_KEY,              "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_CLIENT_CERT_FILE",     $env:SM_CLIENT_CERT_FILE,     "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_CLIENT_CERT_PASSWORD", $env:SM_CLIENT_CERT_PASSWORD, "Machine")
          [System.Environment]::SetEnvironmentVariable("SM_HOST",                 $env:SM_HOST,                 "Machine")
          & $smctl.FullName healthcheck
          & $smctl.FullName creds save $env:SM_API_KEY $env:SM_CLIENT_CERT_PASSWORD
          & $smctl.FullName windows certsync --keypair-alias="${{ secrets.SM_KEYPAIR_ALIAS }}"
      - name: Add signtool to PATH
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          $signtool.DirectoryName | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      - name: Setup and build
        uses: ./.github/actions/setup-build
      - name: Build Windows binaries
        env:
          SM_API_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_CLIENT_CERT_PASSWORD || '' }}
          SM_HOST: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_HOST || '' }}
          SM_KEYPAIR_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SM_KEYPAIR_ALIAS || '' }}
        run: yarn run build:windows
      - name: Prepare release assets
        shell: bash
        run: |
          PACKAGE_NAME=`node -e "console.log(require('./src/package.json').name)"`
          PACKAGE_VERSION=`node -e "console.log(require('./src/package.json').version)"`
          mkdir -p releases/windows
          ls -al output
          cp -af "output/${PACKAGE_NAME}-${PACKAGE_VERSION}-x64.exe" "releases/windows/gSender-${PACKAGE_VERSION}-Windows-64Bit.exe"
          ls -al output releases/windows
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: releases/windows/*
          prerelease: true
          draft: true
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows_artifact
          path: releases/windows/*
          compression-level: 0 # no compression
          retention-days: 7
  build-pi:
    name: Build Raspberry PI packages
    runs-on: ubuntu-24.04-arm
    environment: CI
    env:
      GH_TOKEN: ${{ secrets.CI_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Pi binaries using docker
        shell: bash
        run: |
          scripts/build-pi.sh
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            releases/pi/*
          prerelease: true
          draft: true
      - name: Upload Raspberry Pi artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi_artifact
          path: releases/pi/*
          compression-level: 0 # no compression
          retention-days: 7

  publish-master-latest:
    name: Publish master-latest rolling release
    # Every push to master replaces the master-latest prerelease on this repository
    # with the installers built above, so the newest master is always downloadable.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-linux, build-macos, build-windows, build-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases
          merge-multiple: true
      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -al releases
          COMMIT_LOG=`git log -1 --format='%ci %H %s'`
          NOTES="Rolling build of the master branch, replaced on every push. Build #${GITHUB_RUN_NUMBER}.

          ${COMMIT_LOG}

          These builds are not code-signed. On macOS, right-click the app and choose Open the first time, or run \`xattr -cr /Applications/gSender.app\`. On Windows, choose 'More info' then 'Run anyway' at the SmartScreen prompt."
          # Recreate the release from scratch so no stale assets from an older version linger.
          gh release delete master-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          git tag -f master-latest "$GITHUB_SHA"
          git push -f origin master-latest
          gh release create master-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "master-latest (rolling build #${GITHUB_RUN_NUMBER})" \
            --notes "$NOTES" \
            releases/*
